<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" fill="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#4FD1B5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1.5 8.5 5 1 8.5" fill="none" stroke="#A99BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <linearGradient id="post" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13453C"/>
      <stop offset="1" stop-color="#0F2F29"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="980" rx="28" fill="#0B1110"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif">
    <text x="56" y="76" fill="#EEF5F3" font-size="32" font-weight="700">How a review works</text>
    <text x="56" y="108" fill="#93A8A2" font-size="16">From a pull request on GitHub to the review you post. Everything inside the dashed box runs on your computer.</text>

    <!-- Model provider (outside your computer) -->
    <rect x="652" y="138" width="320" height="66" rx="14" fill="#18152A" stroke="#3E3770"/>
    <text x="676" y="166" fill="#E4E0FF" font-size="15" font-weight="650">Model provider</text>
    <text x="676" y="188" fill="#A99FD6" font-size="13">Anthropic, OpenAI or Cursor, via its CLI</text>

    <!-- GitHub -->
    <rect x="48" y="300" width="280" height="320" rx="18" fill="#141A21" stroke="#2D3540"/>
    <g transform="translate(72 324)" stroke="#E6EDF3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="17" cy="17" r="3"/><circle cx="5" cy="5" r="3"/><path d="M12 5h3a2 2 0 0 1 2 2v7"/><path d="M5 8v11"/>
    </g>
    <text x="104" y="342" fill="#E6EDF3" font-size="19" font-weight="700">GitHub</text>
    <g font-size="14" fill="#C2CCD6">
      <circle cx="78" cy="389" r="3.5" fill="#7D8B99"/><text x="92" y="394">The pull request</text>
      <circle cx="78" cy="425" r="3.5" fill="#7D8B99"/><text x="92" y="430">Diff and description</text>
      <circle cx="78" cy="461" r="3.5" fill="#7D8B99"/><text x="92" y="466">Review threads</text>
      <circle cx="78" cy="497" r="3.5" fill="#7D8B99"/><text x="92" y="502">Checks and reviewers</text>
    </g>
    <rect x="68" y="536" width="240" height="60" rx="12" fill="#10251F" stroke="#24564A"/>
    <text x="86" y="561" fill="#7FE0C8" font-size="13.5" font-weight="650">Your review lands here</text>
    <text x="86" y="580" fill="#8FB8AD" font-size="12.5">Comments on lines, one decision</text>

    <!-- Your computer -->
    <rect x="372" y="228" width="868" height="604" rx="24" fill="#0E1816" stroke="#2C4741" stroke-width="1.5" stroke-dasharray="7 7"/>
    <text x="398" y="262" fill="#4FD1B5" font-size="12" font-weight="700" letter-spacing="1.6">YOUR COMPUTER</text>
    <path d="M900 208V304" stroke="#A99BFF" stroke-width="1.8" stroke-dasharray="4 5" marker-start="url(#arrow-violet)" marker-end="url(#arrow-violet)"/>
    <text x="916" y="250" fill="#A99FD6" font-size="12.5">The diff, description, threads</text>
    <text x="916" y="267" fill="#A99FD6" font-size="12.5">and the files the agents read</text>

    <!-- X-RayViewer column -->
    <text x="400" y="296" fill="#7E948E" font-size="11.5" font-weight="700" letter-spacing="1.2">X-RAYVIEWER</text>
    <g>
      <rect x="400" y="308" width="240" height="98" rx="14" fill="#152220" stroke="#243833"/>
      <text x="420" y="336" fill="#EEF5F3" font-size="16" font-weight="650">Sidebar</text>
      <text x="420" y="360" fill="#93A8A2" font-size="13">Pull requests by how they relate</text>
      <text x="420" y="378" fill="#93A8A2" font-size="13">to you, with risk and review</text>
      <text x="420" y="396" fill="#93A8A2" font-size="13">status</text>

      <rect x="400" y="418" width="240" height="98" rx="14" fill="#152220" stroke="#243833"/>
      <text x="420" y="446" fill="#EEF5F3" font-size="16" font-weight="650">Checkout</text>
      <text x="420" y="470" fill="#93A8A2" font-size="13">A local clone at the pull</text>
      <text x="420" y="488" fill="#93A8A2" font-size="13">request's head commit. Agents</text>
      <text x="420" y="506" fill="#93A8A2" font-size="13">read it and change nothing.</text>

      <rect x="400" y="528" width="240" height="98" rx="14" fill="#152220" stroke="#243833"/>
      <text x="420" y="556" fill="#EEF5F3" font-size="16" font-weight="650">Saved review</text>
      <text x="420" y="580" fill="#93A8A2" font-size="13">Findings, your drafts and</text>
      <text x="420" y="598" fill="#93A8A2" font-size="13">reviewed marks, on disk. Kept</text>
      <text x="420" y="616" fill="#93A8A2" font-size="13">across restarts.</text>

      <rect x="400" y="638" width="240" height="168" rx="14" fill="#121D1B" stroke="#2C4741" stroke-dasharray="5 5"/>
      <text x="420" y="666" fill="#EEF5F3" font-size="16" font-weight="650">Automatic runs</text>
      <g font-size="13" fill="#93A8A2">
        <text x="420" y="692">1  Your review is requested by</text>
        <text x="434" y="710">name, or new commits land</text>
        <text x="420" y="734">2  Two quiet minutes pass</text>
        <text x="420" y="758">3  The agents start</text>
        <text x="420" y="786" fill="#6F857F" font-size="12">Drafts and huge pull requests wait</text>
      </g>
    </g>

    <!-- Agents column -->
    <text x="672" y="296" fill="#7E948E" font-size="11.5" font-weight="700" letter-spacing="1.2">AGENTS, IN PARALLEL</text>
    <g>
      <rect x="672" y="308" width="280" height="98" rx="14" fill="#14302A" stroke="#2F7465"/>
      <g transform="translate(690 326)" stroke="#4FD1B5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="7" height="7" rx="1.6"/><path d="M3.5 7v3.5a1.8 1.8 0 0 0 1.8 1.8H9"/><rect x="9" y="9" width="7" height="7" rx="1.6"/>
      </g>
      <text x="716" y="339" fill="#EEF5F3" font-size="16" font-weight="650">Guide</text>
      <text x="690" y="364" fill="#9CC9BE" font-size="13">Sets the reading order, checks the</text>
      <text x="690" y="382" fill="#9CC9BE" font-size="13">description, and draws how the</text>
      <text x="690" y="400" fill="#9CC9BE" font-size="13">change runs</text>

      <rect x="672" y="418" width="280" height="50" rx="12" fill="#152220" stroke="#243833"/>
      <text x="690" y="448" fill="#EEF5F3" font-size="14.5" font-weight="650">Architecture</text>
      <text x="934" y="448" fill="#7E948E" font-size="12.5" text-anchor="end">boundaries, patterns</text>
      <rect x="672" y="476" width="280" height="50" rx="12" fill="#152220" stroke="#243833"/>
      <text x="690" y="506" fill="#EEF5F3" font-size="14.5" font-weight="650">Correctness</text>
      <text x="934" y="506" fill="#7E948E" font-size="12.5" text-anchor="end">logic, races, edges</text>
      <rect x="672" y="534" width="280" height="50" rx="12" fill="#152220" stroke="#243833"/>
      <text x="690" y="564" fill="#EEF5F3" font-size="14.5" font-weight="650">Tests</text>
      <text x="934" y="564" fill="#7E948E" font-size="12.5" text-anchor="end">behavior no test covers</text>
      <rect x="672" y="592" width="280" height="50" rx="12" fill="#152220" stroke="#243833"/>
      <text x="690" y="622" fill="#EEF5F3" font-size="14.5" font-weight="650">Security</text>
      <text x="934" y="622" fill="#7E948E" font-size="12.5" text-anchor="end">money, sign-in, input</text>

      <rect x="672" y="654" width="280" height="152" rx="14" fill="#111B19" stroke="#22332F"/>
      <text x="690" y="680" fill="#C9D8D4" font-size="13" font-weight="650">Each finding has</text>
      <g font-size="12.5" fill="#93A8A2">
        <text x="690" y="702">a severity, the exact line, why it</text>
        <text x="690" y="720">matters, and a suggested comment.</text>
        <text x="690" y="748">On Claude Code, /code-review runs</text>
        <text x="690" y="766">once, then each agent's own rules.</text>
        <text x="690" y="790">Broken JSON is sent back once to fix.</text>
      </g>
    </g>

    <!-- Review page column -->
    <text x="984" y="296" fill="#7E948E" font-size="11.5" font-weight="700" letter-spacing="1.2">THE REVIEW PAGE: YOU DECIDE</text>
    <g>
      <rect x="984" y="308" width="232" height="86" rx="14" fill="#152220" stroke="#243833"/>
      <text x="1002" y="336" fill="#EEF5F3" font-size="16" font-weight="650">Briefing</text>
      <text x="1002" y="360" fill="#93A8A2" font-size="13">Risk, the agents' summary,</text>
      <text x="1002" y="378" fill="#93A8A2" font-size="13">findings by severity</text>

      <rect x="984" y="406" width="232" height="86" rx="14" fill="#152220" stroke="#243833"/>
      <text x="1002" y="434" fill="#EEF5F3" font-size="16" font-weight="650">Chapters and map</text>
      <text x="1002" y="458" fill="#93A8A2" font-size="13">Read in order, or follow</text>
      <text x="1002" y="476" fill="#93A8A2" font-size="13">the flow box by box</text>

      <rect x="984" y="504" width="232" height="140" rx="14" fill="#152220" stroke="#243833"/>
      <text x="1002" y="532" fill="#EEF5F3" font-size="16" font-weight="650">Findings on the lines</text>
      <text x="1002" y="556" fill="#93A8A2" font-size="13">Each one sits under its code</text>
      <rect x="1002" y="572" width="52" height="26" rx="13" fill="#123A31"/>
      <text x="1028" y="590" fill="#7FE0C8" font-size="12.5" font-weight="650" text-anchor="middle">Keep</text>
      <rect x="1060" y="572" width="66" height="26" rx="13" fill="#1C2A27"/>
      <text x="1093" y="590" fill="#C9D8D4" font-size="12.5" font-weight="650" text-anchor="middle">Reword</text>
      <rect x="1132" y="572" width="70" height="26" rx="13" fill="#2A1C1C"/>
      <text x="1167" y="590" fill="#F0A3A3" font-size="12.5" font-weight="650" text-anchor="middle">Dismiss</text>
      <text x="1002" y="624" fill="#6F857F" font-size="12">or Add all N at once</text>

      <rect x="984" y="656" width="232" height="150" rx="14" fill="#152220" stroke="#243833"/>
      <text x="1002" y="684" fill="#EEF5F3" font-size="16" font-weight="650">Your own comments</text>
      <text x="1002" y="708" fill="#93A8A2" font-size="13">Each has a level, posted as a</text>
      <text x="1002" y="726" fill="#93A8A2" font-size="13">priority tag on GitHub</text>
      <rect x="1002" y="742" width="58" height="24" rx="6" fill="#3A1D1D"/>
      <text x="1031" y="759" fill="#FF9B9B" font-size="12" font-weight="700" text-anchor="middle">P1 High</text>
      <rect x="1066" y="742" width="78" height="24" rx="6" fill="#3A2C14"/>
      <text x="1105" y="759" fill="#FFC56B" font-size="12" font-weight="700" text-anchor="middle">P2 Medium</text>
      <rect x="1150" y="742" width="56" height="24" rx="6" fill="#1F2A33"/>
      <text x="1178" y="759" fill="#A9C2D6" font-size="12" font-weight="700" text-anchor="middle">P3 Low</text>
      <text x="1002" y="790" fill="#6F857F" font-size="12">Saved locally as you type</text>
    </g>

    <!-- Post -->
    <rect x="1272" y="300" width="280" height="320" rx="18" fill="url(#post)" stroke="#2F8C79"/>
    <text x="1296" y="342" fill="#EEF5F3" font-size="19" font-weight="700">Post</text>
    <g font-size="14">
      <circle cx="1306" cy="383" r="11" fill="#1C5C50"/><text x="1306" y="388" fill="#BFF3E6" font-size="12" font-weight="700" text-anchor="middle">1</text>
      <text x="1326" y="388" fill="#DDEFEA">Preview what's sent</text>
      <circle cx="1306" cy="421" r="11" fill="#1C5C50"/><text x="1306" y="426" fill="#BFF3E6" font-size="12" font-weight="700" text-anchor="middle">2</text>
      <text x="1326" y="426" fill="#DDEFEA">Pick Comment, Approve</text>
      <text x="1326" y="444" fill="#DDEFEA">or Request changes</text>
      <circle cx="1306" cy="477" r="11" fill="#1C5C50"/><text x="1306" y="482" fill="#BFF3E6" font-size="12" font-weight="700" text-anchor="middle">3</text>
      <text x="1326" y="482" fill="#DDEFEA">Post to GitHub</text>
    </g>
    <rect x="1292" y="514" width="240" height="86" rx="12" fill="#0C211D" stroke="#1F5247"/>
    <text x="1310" y="540" fill="#9FD9CA" font-size="12.5">Nothing is posted until you press</text>
    <text x="1310" y="558" fill="#9FD9CA" font-size="12.5">it, unless Post all findings when</text>
    <text x="1310" y="576" fill="#9FD9CA" font-size="12.5">finished is checked before a run.</text>

    <!-- Arrows -->
    <path d="M330 400H396" stroke="#4FD1B5" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="335" y="390" fill="#7FCDBB" font-size="12">gh, git</text>
    <path d="M642 456H668" stroke="#4FD1B5" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M954 456H980" stroke="#4FD1B5" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M1218 456H1268" stroke="#4FD1B5" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="1222" y="446" fill="#7FCDBB" font-size="12">kept</text>
    <path d="M1412 622V872H350V566H332" stroke="#4FD1B5" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="640" y="858" width="404" height="28" rx="14" fill="#0B1110"/>
    <text x="842" y="877" fill="#7FCDBB" font-size="13" text-anchor="middle">gh posts one review: comments, replies, resolved threads</text>

    <!-- Footer -->
    <g font-size="13.5">
      <circle cx="64" cy="932" r="5" fill="#4FD1B5"/>
      <text x="78" y="937" fill="#C9D8D4"><tspan font-weight="650">Stays here:</tspan><tspan fill="#93A8A2"> drafts, agent results, run logs and ~/.xrayviewer. No telemetry.</tspan></text>
      <circle cx="760" cy="932" r="5" fill="#A99BFF"/>
      <text x="774" y="937" fill="#C9D8D4"><tspan font-weight="650">Leaves:</tspan><tspan fill="#93A8A2"> GitHub through gh and git, and your model provider through its CLI.</tspan></text>
    </g>
  </g>
</svg>
